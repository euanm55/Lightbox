# Publishes the viewer to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy viewer to GitHub Pages
on:
  push:
    branches: [main, master, claude/dicom-image-viewer-1u7dh0]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site (viewer + sample study only)
        run: |
          mkdir -p site/sample
          cp index.html site/
          cp sample/synthetic_mri.zip site/sample/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
