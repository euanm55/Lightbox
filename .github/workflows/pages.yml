# Publishes index.html and the sample study to GitHub Pages on every push to
# main when repository Settings -> Pages -> Source is "GitHub Actions".
# With Source: "Deploy from a branch" GitHub publishes the branch itself; the
# configure step then fails harmlessly and the deploy is skipped.
name: Deploy viewer to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.cfg.outcome != 'success'
        run: echo "Pages is not set to the GitHub Actions source; nothing to deploy from here."
      - name: Assemble site (viewer + sample study only)
        if: steps.cfg.outcome == 'success'
        run: |
          mkdir -p site/sample
          cp index.html site/
          cp sample/synthetic_mri.zip site/sample/
          touch site/.nojekyll
      - if: steps.cfg.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        if: steps.cfg.outcome == 'success'
        uses: actions/deploy-pages@v4
